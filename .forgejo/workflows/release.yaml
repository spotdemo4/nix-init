name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  release:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@90fe0da793883e878fa0a09ac2979190074920c4 # v1.67.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          token: ${{ secrets.DOCTOR_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: release
          fetch_depth: 0

      - name: Release to Forgejo
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
